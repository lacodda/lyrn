[package]
name = "lyrn"
version = "2.9.1"
edition = "2024"
rust-version = "1.85"
description = "Start a new web application on the lacodda line's stack with one command"
repository = "https://github.com/lacodda/lyrn.git"
authors = ["Kirill Lakhtachev <lahtachev@gmail.com> (https://lacodda.com)"]
readme = "README.md"
license = "MIT"
keywords = ["cli", "scaffold", "template", "vite", "react"]
categories = ["command-line-utilities", "development-tools"]

# assets/icon.ico is required by build.rs on Windows; the rest of the brand
# artwork only serves GitHub and the docs site.
# Leading slashes matter: these are globs matched anywhere in the tree, and a
# bare `docs/` would also drop `src/templates/*/docs`, which `include_str!`
# needs - the crate then builds here and fails to build from its own tarball.
exclude = [
    "/docs/",
    "/.github/",
    "/cliff.toml",
    "/rustfmt.toml",
    "/assets/social-preview.png",
    "/assets/logo-512.png",
    "/assets/apple-touch-icon.png",
    "/assets/favicon-32.png",
]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12.0"
# Case filters for cargo-generate templates: the crate cargo-generate itself
# uses, so `{{ project-name | pascal_case }}` comes out the same in both.
heck = "0.5.0"
# cargo-generate templates are Liquid, and a Liquid subset would render some of
# them differently from the tool they were written for.
liquid = "0.26.11"
liquid-core = "0.26.11"
# A cargo-generate placeholder may carry a `regex` its answer has to match.
regex = "1.13.1"
# Asks GitHub whether a template's tag passed its CI. Blocking and rustls, as
# turnout and the cli form's self-update use it.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# A template from GitHub is cloned into a directory that has to disappear
# whatever happens to the generation.
tempfile = "3.27.0"
# Ordered tables: a cargo-generate template asks its placeholders in the order
# it declares them, and the export writes a manifest in the order it was read.
toml = { version = "1.1.6", features = ["preserve_order"] }

[dev-dependencies]
assert_cmd = "2.2.2"
# Decodes the placeholder icon so `tests/placeholder_icon.rs` can hold it to
# the line's level rule by its pixels. A dev-dependency only: nothing lyrn
# ships reads an image.
#
# Pinned below 0.25.10, which raises its own MSRV to 1.88 - above the 1.85 this
# crate declares. Moving it means moving `rust-version` first, deliberately.
image = { version = "=0.25.9", default-features = false, features = ["png"] }
predicates = "3.1.4"

# Line-table debug info keeps backtraces readable while cutting the .pdb weight
# that dominates target/debug. Full debug info is a one-line revert when needed.
[profile.dev]
debug = 1
