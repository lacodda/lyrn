[package]
name = "lyrn"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "Start a new web application on the lacodda line's stack with one command"
repository = "https://github.com/lacodda/lyrn.git"
authors = ["Kirill Lakhtachev <lahtachev@gmail.com> (https://lacodda.com)"]
readme = "README.md"
license = "MIT"
keywords = ["cli", "scaffold", "template", "vite", "react"]
categories = ["command-line-utilities", "development-tools"]

# assets/icon.ico is required by build.rs on Windows; the rest of the brand
# artwork only serves GitHub and the docs site.
exclude = [
    "docs/",
    ".github/",
    "cliff.toml",
    "rustfmt.toml",
    "assets/social-preview.png",
    "assets/logo-512.png",
    "assets/apple-touch-icon.png",
    "assets/favicon-32.png",
]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.27.0"
