[package]
name = "lyrn"
version = "1.3.0"
edition = "2024"
rust-version = "1.85"
description = "🚀 Command-line tool for quickly starting the development of your web application"
repository = "https://github.com/lacodda/lyrn.git"
authors = ["Kirill Lakhtachev <lahtachev@gmail.com> (https://lacodda.com)"]
readme = "README.md"
license = "MIT"
keywords = ["cli", "tool", "template"]
categories = ["cli"]

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
json_value_merge = "2.0.1"
local-ip-address = "0.6.13"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
spinners = "4.2.0"
tempfile = "3.27.0"
