name = "spa"
description = "Single-page app: Vite, React, TypeScript, Tailwind, dowel"
standard = "2026.09"

# Files whose own syntax collides with the placeholder braces. `cliff.toml` is
# a Tera template using bare `{{ }}` for its own variables, so it has to travel
# untouched. GitHub Actions expressions are `${{ }}` and the renderer leaves
# those alone by itself, so workflows do not belong here.
#
# The dowel copies under `src/components/ui/` are the registry's text, byte for
# byte, and `tools/check-registry.mjs` holds them to it: nothing in them is
# lyrn's to substitute.
verbatim = ["cliff.toml", "src/components/ui/button.tsx"]

[[hooks]]
name = "Installing dependencies"
run = ["pnpm", "install"]
optional = true

[[hooks]]
name = "Starting the repository"
run = ["git", "init", "--initial-branch=main"]
starts_repository = true
optional = true

[[hooks]]
name = "Staging the first commit"
run = ["git", "add", "."]
starts_repository = true
optional = true

# Conventional Commits from the very first entry, so the changelog the
# repository already carries can be generated from the history.
[[hooks]]
name = "Creating the first commit"
run = ["git", "commit", "-m", "feat: scaffold the project with lyrn"]
starts_repository = true
optional = true
