name = "spa"
description = "Single-page app: Vite, React, TypeScript, Tailwind, dowel"
standard = "2026.09"

# Files whose own syntax collides with the placeholder braces, or that must
# reach the new project byte for byte.
# `cliff.toml` is Tera and `ci.yml` is GitHub Actions; both use the same
# double-brace syntax for their own purposes.
verbatim = ["cliff.toml", ".github/workflows/ci.yml"]

[[hooks]]
name = "Installing dependencies"
run = ["pnpm", "install"]
optional = true

[[hooks]]
name = "Starting the repository"
run = ["git", "init", "--initial-branch=main"]
optional = true

[[hooks]]
name = "Staging the first commit"
run = ["git", "add", "."]
optional = true

# Conventional Commits from the very first entry, so the changelog the
# repository already carries can be generated from the history.
[[hooks]]
name = "Creating the first commit"
run = ["git", "commit", "-m", "feat: scaffold the project with lyrn"]
optional = true
