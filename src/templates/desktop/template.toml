name = "desktop"
description = "Desktop app: Tauri 2 around the spa stack"
standard = "2026.09"

# `cliff.toml` is a Tera template using bare `{{ }}` for its own variables, and
# `check-locales.mjs` matches i18next's `{{name}}` interpolation with a regular
# expression - both would be mangled by substitution. GitHub Actions writes
# `${{ }}`, which the renderer skips on its own.
verbatim = ["cliff.toml", "tools/check-locales.mjs"]

[[hooks]]
name = "Installing dependencies"
run = ["pnpm", "install"]
optional = true

[[hooks]]
name = "Starting the repository"
run = ["git", "init", "--initial-branch=main"]
optional = true

[[hooks]]
name = "Staging the first commit"
run = ["git", "add", "."]
optional = true

[[hooks]]
name = "Creating the first commit"
run = ["git", "commit", "-m", "feat: scaffold the project with lyrn"]
optional = true
