name = "plugin"
description = "Plugin for a host of the line: an executable speaking JSON over stdio"
standard = "2026.09"

# `cliff.toml` is a Tera template using bare `{{ }}` for its own variables, so
# it has to travel untouched. GitHub Actions expressions are `${{ }}` and the
# renderer leaves those alone by itself.
verbatim = ["cliff.toml"]

[[hooks]]
name = "Fetching dependencies"
run = ["cargo", "fetch"]
optional = true

[[hooks]]
name = "Starting the repository"
run = ["git", "init", "--initial-branch=main"]
starts_repository = true
optional = true

[[hooks]]
name = "Staging the first commit"
run = ["git", "add", "."]
starts_repository = true
optional = true

[[hooks]]
name = "Creating the first commit"
run = ["git", "commit", "-m", "feat: scaffold the project with lyrn"]
starts_repository = true
optional = true
