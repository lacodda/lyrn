# The line's standard 2026.11.1: what it changed, and the template of each
# of its files by form. `lyrn upgrade` renders the version a repository is
# on from here, as the common ancestor of a three-way merge.
#
# Written by `LYRN_BLESS=1 cargo test standard`, all but `changes`, which
# is said by hand. Once a release has carried a version it never changes:
# a later change to a file of the standard is a new version.

changes = [
    "Every workflow that sets up Node asks for the newest release of its major (`check-latest: true`): the one the runner has cached lags the floor Astro and Vite raise in patch releases, and Astro 7.4.2 refused the Node 22.23.3 GitHub's runners had.",
    "In the files a project starts with rather than the standard's: the docs form's workflows ask for the newest Node too, and `lyrn doctor --fix` adds the line to the others.",
]

# Files written as they are, with no placeholder substituted.
verbatim = ["cliff.toml"]

