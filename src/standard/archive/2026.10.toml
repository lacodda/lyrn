# The line's standard 2026.10: what it changed, and the template of each
# of its files by form. `lyrn upgrade` renders the version a repository is
# on from here, as the common ancestor of a three-way merge.
#
# Written by `LYRN_BLESS=1 cargo test standard`, all but `changes`, which
# is said by hand. Once a release has carried a version it never changes:
# a later change to a file of the standard is a new version.

changes = [
    "The first version lyrn keeps: the files lyrn 2.10.0 wrote into every repository it started or adopted.",
    "A licence, a changelog generated by git-cliff, editor and git settings, and `lyrn.toml`.",
    "The CI gate, and an audit workflow in place of Dependabot's pull requests, with ADR 0002 saying why.",
    "A security policy, a Code of Conduct, issue and pull request templates, and the first ADRs.",
    "The coding assistants' files kept out of git by the block that ends `.gitignore`.",
]

# Files written as they are, with no placeholder substituted.
verbatim = ["cliff.toml"]

