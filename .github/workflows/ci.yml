name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

  # rust-version is a promise to anyone running `cargo install`. Without a job
  # that actually builds on it, the number silently rots the first time a new
  # API is used — so read it from the manifest and hold it to it.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from the manifest
        id: msrv
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Build on the declared MSRV
        run: cargo check --all-targets

  # A template that does not build is not a template. Generate each form on
  # every platform and run the gate the generated project ships with — the one
  # its own CI would run.
  template:
    name: template ${{ matrix.form }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        form: [spa]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        shell: bash
        run: |
          ./target/release/lyrn new demo-app \
            --form ${{ matrix.form }} \
            --accent '#6D7BF2' \
            --yes --no-hooks \
            --path "$RUNNER_TEMP/demo-app"
      - name: Install its dependencies
        working-directory: ${{ runner.temp }}/demo-app
        run: pnpm install --no-frozen-lockfile
      - name: Run the gate it ships with
        working-directory: ${{ runner.temp }}/demo-app
        run: pnpm lint
      - name: Build it
        working-directory: ${{ runner.temp }}/demo-app
        run: pnpm build
