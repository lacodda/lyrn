name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

  # rust-version is a promise to anyone running `cargo install`. Without a job
  # that actually builds on it, the number silently rots the first time a new
  # API is used — so read it from the manifest and hold it to it.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from the manifest
        id: msrv
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Build on the declared MSRV
        run: cargo check --all-targets

  # A template that does not build is not a template. Generate each form on
  # every platform and run the gate the generated project ships with — the one
  # its own CI would run. The spa's add-ons share main.tsx, App.tsx and
  # index.html, so none and all of them go through every platform, and each
  # one alone through Linux; the rest of the sixteen sets are held by the
  # tree snapshots and the rendering tests.
  template:
    name: template spa (${{ matrix.addons || 'none' }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        addons: ['', 'router,tanstack-query,auth,pwa']
        include:
          - { os: ubuntu-latest, addons: router }
          - { os: ubuntu-latest, addons: tanstack-query }
          - { os: ubuntu-latest, addons: auth }
          - { os: ubuntu-latest, addons: pwa }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        shell: bash
        run: |
          args=(new demo-app --form spa --accent '#6D7BF2' --yes --no-hooks --path "$RUNNER_TEMP/demo-app")
          if [ -n "${{ matrix.addons }}" ]; then
            args+=(--with "${{ matrix.addons }}")
          fi
          ./target/release/lyrn "${args[@]}"
      - name: Install its dependencies
        working-directory: ${{ runner.temp }}/demo-app
        run: pnpm install --no-frozen-lockfile
      - name: Run the gate it ships with
        working-directory: ${{ runner.temp }}/demo-app
        run: pnpm lint
      - name: Build it
        working-directory: ${{ runner.temp }}/demo-app
        run: pnpm build

  # The cli form is checked with cargo rather than pnpm, and every combination
  # of its add-ons is generated: the failures live in the seams, and a seam
  # only exists once a particular combination is produced.
  template-cli:
    name: template cli (${{ matrix.addons || 'none' }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        addons: ['', 'keyring', 'self-update', 'keyring,self-update']
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps (keyring secret-service)
        if: runner.os == 'Linux' && contains(matrix.addons, 'keyring')
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        shell: bash
        run: |
          args=(new demo-tool --form cli --yes --no-hooks --repo owner/demo-tool --path "$RUNNER_TEMP/demo-tool")
          if [ -n "${{ matrix.addons }}" ]; then
            args+=(--with "${{ matrix.addons }}")
          fi
          ./target/release/lyrn "${args[@]}"
      - name: Run the gate it ships with
        working-directory: ${{ runner.temp }}/demo-tool
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # The desktop form pulls the whole webview stack, so it runs on Linux only
  # and stops short of bundling an installer: what is being checked is that
  # the generated project holds together, not that Tauri can package.
  template-desktop:
    name: template desktop (${{ matrix.addons || 'none' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addons: ['', 'i18n']
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        shell: bash
        run: |
          args=(new demo-app --form desktop --accent '#6D7BF2' --yes --no-hooks --repo owner/demo-app --path "$RUNNER_TEMP/demo-app")
          if [ -n "${{ matrix.addons }}" ]; then
            args+=(--with "${{ matrix.addons }}")
          fi
          ./target/release/lyrn "${args[@]}"
      - name: Install its dependencies
        working-directory: ${{ runner.temp }}/demo-app
        run: pnpm install --no-frozen-lockfile
      - name: Run the frontend gate it ships with
        working-directory: ${{ runner.temp }}/demo-app
        run: pnpm lint
      - name: Build the frontend
        working-directory: ${{ runner.temp }}/demo-app
        run: pnpm build
      - name: Run the Rust gate it ships with
        working-directory: ${{ runner.temp }}/demo-app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # The service form's own tests skip themselves without a database, so the
  # gate has to provide one - otherwise this job would prove only that the
  # project compiles.
  template-service:
    name: template service (${{ matrix.addons || 'none' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addons: ['', 'spa', 'demo', 'spa,demo']
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: demo_svc
          POSTGRES_PASSWORD: demo_svc
          POSTGRES_DB: demo_svc
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        shell: bash
        run: |
          args=(new demo-svc --form service --yes --no-hooks --repo owner/demo-svc --path "$RUNNER_TEMP/demo-svc")
          if [ -n "${{ matrix.addons }}" ]; then
            args+=(--with "${{ matrix.addons }}")
          fi
          ./target/release/lyrn "${args[@]}"
      - name: Run the gate it ships with
        working-directory: ${{ runner.temp }}/demo-svc
        env:
          DATABASE_URL: postgres://demo_svc:demo_svc@localhost:5432/demo_svc
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      # With the web UI the binary carries frontend/dist, and the generated CI
      # gates the UI in a job of its own: the same three commands here.
      - uses: pnpm/action-setup@v6
        if: contains(matrix.addons, 'spa')
        with:
          version: 10
      - uses: actions/setup-node@v7
        if: contains(matrix.addons, 'spa')
        with:
          node-version: 22
          check-latest: true
      - name: Run the web UI's gate
        if: contains(matrix.addons, 'spa')
        working-directory: ${{ runner.temp }}/demo-svc/frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm lint
          pnpm build

  # The stand a service describes in turnout.json, put up the way `lyrn stand
  # up` has turnout put it up: staged from HEAD, built and started by its
  # restart command with the port as STAND_PORT, asked its health, then filled
  # by its seed and asked again, then its image built by its image command.
  # Every command is read from the generated file, so what is proven is the
  # very line turnout is handed - on arm64 too, which is what a Raspberry Pi
  # stand builds its image on.
  template-service-stand:
    name: template service stand (spa,demo) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        run: ./target/release/lyrn new demo-svc --form service --with spa,demo --yes --no-hooks --repo owner/demo-svc --path "$RUNNER_TEMP/demo-svc"
      # What the hooks do: the lockfiles the image installs from, then the
      # first commit, which is what a stand is staged from.
      - name: Commit it, as the hooks would
        working-directory: ${{ runner.temp }}/demo-svc
        run: |
          cargo generate-lockfile
          (cd frontend && pnpm install --no-frozen-lockfile)
          git init --initial-branch=main --quiet
          git add .
          git -c user.name=ci -c user.email=ci@example.invalid commit --quiet -m "feat: scaffold the project with lyrn"
      - name: Stage what turnout uploads
        working-directory: ${{ runner.temp }}/demo-svc
        run: sh -c "$(jq -r .commands.build turnout.json)"
      - name: Put the stand up with its restart command
        working-directory: ${{ runner.temp }}/demo-svc/target/stand
        run: |
          port=$(jq -r .stand.port turnout.json)
          printf 'POSTGRES_PASSWORD=%s\n' "$(od -An -N24 -tx1 /dev/urandom | tr -d ' \n')" > deploy/.env
          sh -c "STAND_PORT=$port $(jq -r .stand.restart turnout.json)"
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors "http://localhost:$port$(jq -r .stand.health turnout.json)"
      - name: Fill it with its seed
        working-directory: ${{ runner.temp }}/demo-svc/target/stand
        run: |
          port=$(jq -r .stand.port turnout.json)
          sh -c "STAND_PORT=$port $(jq -r .stand.seed turnout.json)"
          for attempt in $(seq 30); do
            if curl --fail --silent "http://localhost:$port$(jq -r .stand.health turnout.json)" | jq -e '.demo == true'; then
              exit 0
            fi
            sleep 2
          done
          echo "the seeded stand does not say it is a demonstration" >&2
          exit 1
      - name: Build its image with its image command
        working-directory: ${{ runner.temp }}/demo-svc/target/stand
        run: sh -c "$(jq -r .stand.image turnout.json)"
      - name: What the stand said
        if: failure()
        working-directory: ${{ runner.temp }}/demo-svc/target/stand
        run: docker compose -f deploy/compose.yml logs

  # The workspace form is the cli form in two crates, so the gate is the cli
  # gate with `--workspace` - plus the two things only a workspace can get
  # wrong: doctests in the library, and a library that does not package on its
  # own. `cargo package` on the core crate is what catches a README path or an
  # exclude that leaves the published crate unbuildable.
  template-workspace:
    name: template workspace (${{ matrix.addons || 'none' }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        addons: ['', 'keyring,self-update']
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps (keyring secret-service)
        if: runner.os == 'Linux' && contains(matrix.addons, 'keyring')
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        shell: bash
        run: |
          args=(new demo-tool --form workspace --yes --no-hooks --repo owner/demo-tool --path "$RUNNER_TEMP/demo-tool")
          if [ -n "${{ matrix.addons }}" ]; then
            args+=(--with "${{ matrix.addons }}")
          fi
          ./target/release/lyrn "${args[@]}"
      - name: Run the gate it ships with
        working-directory: ${{ runner.temp }}/demo-tool
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo test --workspace --doc
      # A library that builds in place but not from its own tarball is a crate
      # nobody can install - and it only shows on the day of the release.
      - name: Package the library on its own
        working-directory: ${{ runner.temp }}/demo-tool
        run: cargo package --package demo-tool-core

  # The mono form is checked with pnpm, and the check that matters most is the
  # last one: a package can build, typecheck and pass its tests while being
  # impossible to import, because `tsc` resolves specifiers Node then refuses.
  # Only a different process, outside the workspace, finds that.
  template-mono:
    name: template mono (${{ matrix.addons || 'none' }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        addons: ['', 'stand']
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        shell: bash
        run: |
          args=(new demo-lib --form mono --yes --no-hooks --repo owner/demo-lib --path "$RUNNER_TEMP/demo-lib")
          if [ -n "${{ matrix.addons }}" ]; then
            args+=(--with "${{ matrix.addons }}")
          fi
          ./target/release/lyrn "${args[@]}"
      - name: Install its dependencies
        working-directory: ${{ runner.temp }}/demo-lib
        run: pnpm install --no-frozen-lockfile
      - name: Run the gate it ships with
        working-directory: ${{ runner.temp }}/demo-lib
        run: pnpm lint
      - name: Build it
        working-directory: ${{ runner.temp }}/demo-lib
        run: pnpm build
      - name: Import the package the way a consumer does
        shell: bash
        working-directory: ${{ runner.temp }}/demo-lib
        run: |
          set -eu
          tarball="$(cd packages/demo-lib && pnpm pack --silent | tail -n1)"
          consumer="$RUNNER_TEMP/consumer"
          rm -rf "$consumer" && mkdir -p "$consumer"
          cp "packages/demo-lib/$tarball" "$consumer/"
          cd "$consumer"
          npm init -y > /dev/null
          npm pkg set type=module > /dev/null
          npm install --no-audit --no-fund "./$tarball" > /dev/null
          node --input-type=module -e '
            import { greet } from "demo-lib"
            const actual = greet("world")
            if (actual !== "Hello, world!") {
              throw new Error("the installed package returned " + actual)
            }
            console.log("imported from the tarball:", actual)
          '

  # The plugin form is a Rust binary, so its own gate is the cli form's. What
  # this job adds is the part no unit test can reach: the generated binary run
  # the way the host runs it, and its answers read back with the host's own
  # rules. A plugin that passes `cargo test` and fails here is one the host
  # would list and refuse.
  template-plugin:
    name: template plugin (${{ matrix.host }}${{ matrix.with && ' +' || '' }}${{ matrix.with }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # One host of each shape and protocol: kilna and kasl run commands,
        # sefy hands a transport a file, and kasl asks requests besides.
        host: [kilna, kasl, sefy]
        with: ['']
        include:
          - { os: ubuntu-latest, host: kasl, with: source }
          - { os: windows-latest, host: kasl, with: source }
          - { os: macos-latest, host: kasl, with: source }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        shell: bash
        run: |
          with=()
          if [ -n "${{ matrix.with }}" ]; then with=(--with "${{ matrix.with }}"); fi
          ./target/release/lyrn new demo-count \
            --form plugin \
            --host ${{ matrix.host }} \
            "${with[@]}" \
            --yes --no-hooks \
            --repo owner/demo-count \
            --path "$RUNNER_TEMP/demo-count"
      - name: Run the gate it ships with
        working-directory: ${{ runner.temp }}/demo-count
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      # The calls the host makes, against the built binary rather than the
      # test harness: `--manifest` has to parse and declare the host's protocol
      # version, and `run` has to answer a JSON call on stdin with JSON on
      # stdout. Checked here with jq so that a plugin whose own tests were
      # weakened is still held to the wire.
      - name: Speak the protocol the way the host does
        shell: bash
        working-directory: ${{ runner.temp }}/demo-count
        run: |
          set -eu
          cargo build --release
          bin="target/release/${{ matrix.host }}-plugin-demo-count"
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"

          manifest="$("$bin" --manifest)"
          echo "$manifest" | jq -e '.protocol_version == 1' > /dev/null

          if [ "${{ matrix.host }}" = sefy ]; then
            # A transport: the operations sefy reads, no command, and a file
            # carried away and back unchanged. Relative paths, so the same
            # request reads the same on every runner.
            echo "$manifest" | jq -e '.operations == ["push", "pull"]' > /dev/null
            echo "$manifest" | jq -e 'has("commands") | not' > /dev/null
            printf 'sealed\000\377bytes' > sealed
            export SEFY_DEMO_COUNT_DESTINATION=kept
            pushed="$(jq -cn '{operation: "push", file: "sealed", name: "vault"}' | "$bin" run)"
            echo "$pushed" | jq -e 'has("error") | not' > /dev/null
            pulled="$(jq -cn '{operation: "pull", file: "back", name: "vault"}' | "$bin" run)"
            echo "$pulled" | jq -e 'has("error") | not' > /dev/null
            cmp sealed back
            echo "carried a file there and back: $pushed $pulled"
            exit 0
          fi

          echo "$manifest" | jq -e '.commands | length > 0' > /dev/null
          call="$(echo "$manifest" | jq -c '{command: .commands[0].key, target: .commands[0].target, subject: {title: "A subject"}}')"
          outcome="$(echo "$call" | "$bin" run)"
          echo "$outcome" | jq -e 'has("meta") or has("message")' > /dev/null
          echo "$outcome" | jq -e 'has("error") | not' > /dev/null
          echo "spoke the protocol: $outcome"

          if [ "${{ matrix.with }}" = source ]; then
            # The requests: a listing kasl reads whole even when it is empty,
            # and the day's tasks as a list.
            echo "$manifest" | jq -e '.requests | index("list_issues") != null' > /dev/null
            listed="$(echo '{"protocol_version":1,"request":"list_issues","settings":{}}' | "$bin" run)"
            echo "$listed" | jq -e '.issues | type == "array"' > /dev/null
            found="$(echo '{"protocol_version":1,"request":"find_tasks","subject":{"date":"2026-10-27"},"settings":{}}' | "$bin" run)"
            echo "$found" | jq -e '.tasks | type == "array"' > /dev/null
            echo "answered the requests: $listed $found"
          fi

  # The tauri-plugin form is two halves that only work if they agree, so both
  # gates run and neither one alone is the answer. The Rust half needs the
  # webview stack to link, which is why this is Linux only - the same reason
  # the desktop form is.
  template-tauri-plugin:
    name: template tauri-plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
      - name: Install Linux build deps (webview)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        shell: bash
        run: |
          ./target/release/lyrn new demo-shelf \
            --form tauri-plugin \
            --yes --no-hooks \
            --repo owner/demo-shelf \
            --path "$RUNNER_TEMP/demo-shelf"
      - name: Run the Rust gate it ships with
        working-directory: ${{ runner.temp }}/demo-shelf
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Install its dependencies
        working-directory: ${{ runner.temp }}/demo-shelf
        run: pnpm install --no-frozen-lockfile
      - name: Run the webview gate it ships with
        working-directory: ${{ runner.temp }}/demo-shelf
        run: |
          pnpm lint
          pnpm test
          pnpm build
      # The two halves agree on three spellings, and only one of them is
      # checked by either gate on its own: the permission Tauri generates from
      # `build.rs` has to be the one `permissions/default.toml` grants and the
      # one the webview invokes.
      - name: The halves agree on the command
        shell: bash
        working-directory: ${{ runner.temp }}/demo-shelf
        run: |
          set -eu
          key="$(grep -oP '(?<=COMMANDS: &\[&str\] = &\[")[^"]+' build.rs)"
          # The permission an application grants, and the one Tauri generated
          # from build.rs - two files that have to name the same command.
          grep -qF "allow-$key" permissions/default.toml
          test -f "permissions/autogenerated/commands/$key.toml"
          # The webview's half. `-F` because the invoked string is a template
          # literal, `plugin:${PLUGIN}|<key>`, and `|` is a regular expression
          # alternation that would match almost anything.
          grep -qF "|$key\`" guest-js/index.ts
          grep -qF "const PLUGIN = 'demo-shelf'" guest-js/index.ts
          echo "the halves agree on: $key"

  # Every generated repository carries an audit workflow, and it has to be
  # green on the day the project is made: a template whose own audit fails is
  # one more red build nobody asked for. Linux only - the checks read
  # lockfiles and licenses, which do not change with the platform.
  template-audit:
    name: template audit (${{ matrix.form }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { form: spa, with: 'router,tanstack-query,auth,pwa', crates: false, packages: '.' }
          - { form: cli, with: 'keyring,self-update', crates: true, packages: '' }
          - { form: desktop, with: i18n, crates: true, packages: '.' }
          - { form: service, with: 'spa,demo', crates: true, packages: frontend }
          - { form: workspace, with: 'keyring,self-update', crates: true, packages: '' }
          - { form: mono, with: stand, crates: false, packages: '.' }
          - { form: plugin, with: '', crates: true, packages: '' }
          - { form: tauri-plugin, with: '', crates: true, packages: '.' }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        shell: bash
        run: |
          args=(new demo-app --form ${{ matrix.form }} --yes --no-hooks --repo owner/demo-app --path "$RUNNER_TEMP/demo-app")
          if [ "${{ matrix.form }}" = plugin ]; then args+=(--host kilna); fi
          if [ -n "${{ matrix.with }}" ]; then args+=(--with "${{ matrix.with }}"); fi
          ./target/release/lyrn "${args[@]}"
      - name: Crates - advisories, licenses, sources
        if: matrix.crates
        working-directory: ${{ runner.temp }}/demo-app
        shell: bash
        run: |
          manifest=Cargo.toml
          if [ "${{ matrix.form }}" = desktop ]; then manifest=src-tauri/Cargo.toml; fi
          cargo deny --manifest-path "$manifest" check
      - name: Packages - advisories, licenses
        if: matrix.packages != ''
        working-directory: ${{ runner.temp }}/demo-app/${{ matrix.packages }}
        run: |
          pnpm install --no-frozen-lockfile
          pnpm audit --prod
          node tools/check-licenses.mjs

  # The docs form adds to a repository, so it is generated into one: a cli
  # project, which already carries docs/adr/. The run then holds the three
  # promises the form makes - nothing that was there changes, the site builds
  # without a warning, and the build writes the machine-readable twins.
  template-docs:
    name: template docs on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a repository, then add docs to it
        shell: bash
        run: |
          set -eu
          lyrn="$PWD/target/release/lyrn"
          "$lyrn" new demo-tool --form cli --yes --no-hooks --repo owner/demo-tool --path "$RUNNER_TEMP/demo-tool"
          # sha256sum is missing on macOS and shasum on the Windows runner.
          if command -v sha256sum > /dev/null; then sum=(sha256sum); else sum=(shasum -a 256); fi
          cd "$RUNNER_TEMP/demo-tool"
          find . -type f | sort | xargs "${sum[@]}" > "$RUNNER_TEMP/before.txt"
          "$lyrn" new demo-tool --form docs --yes --no-hooks --repo owner/demo-tool \
            --description "The demo tool's manual: every command, exactly."
          "${sum[@]}" -c "$RUNNER_TEMP/before.txt" > /dev/null
          echo "every file that was there is unchanged"
      - name: Install the site
        working-directory: ${{ runner.temp }}/demo-tool/docs
        run: pnpm install --no-frozen-lockfile
      # What docs-audit.yml will run on the day the site is added: green, with
      # the advisories the template accepts and nothing else.
      - name: Audit the site
        working-directory: ${{ runner.temp }}/demo-tool/docs
        run: pnpm audit
      # `lyrn assets` draws every icon from the masters by the level rule.
      # What it promises, checked from outside: the cli's .ico where build.rs
      # reads it, largest image first, every entry a whole PNG; the site's
      # header and favicon byte for byte the L and S masters.
      - name: Draw the icons from the masters
        shell: bash
        working-directory: ${{ runner.temp }}/demo-tool
        run: |
          set -eu
          "$GITHUB_WORKSPACE/target/release/lyrn" assets
          node -e '
            const b = require("fs").readFileSync("assets/icon.ico")
            const sizes = []
            for (let i = 0; i < b.readUInt16LE(4); i++) {
              const e = 6 + 16 * i
              sizes.push(b.readUInt8(e) || 256)
              const at = b.readUInt32LE(e + 12)
              if (b.toString("latin1", at + 1, at + 4) !== "PNG") throw new Error("entry " + i + " is not a PNG")
            }
            if (sizes.join() !== "256,128,64,48,32,24,16") throw new Error("icon.ico entries: " + sizes.join())
            console.log("icon.ico:", sizes.join(" "))
          '
          cmp docs/src/assets/logo.svg assets/logo.svg
          cmp docs/public/favicon.svg assets/logo-s.svg
          for raster in favicon-32.png apple-touch-icon.png logo-512.png; do
            test -s "assets/$raster" || { echo "not drawn: assets/$raster"; exit 1; }
          done
      - name: Build it, without a warning
        shell: bash
        working-directory: ${{ runner.temp }}/demo-tool/docs
        run: |
          set -eu
          pnpm build 2>&1 | tee build.log
          if grep -E '\[WARN\]' build.log; then
            echo "the generated site builds with warnings"
            exit 1
          fi
      - name: Check what the build wrote for agents
        shell: bash
        working-directory: ${{ runner.temp }}/demo-tool/docs/dist
        run: |
          set -eu
          head -1 llms.txt | grep -qx '# Demo Tool'
          grep -q 'https://owner.github.io/demo-tool/guides/writing-a-page.md' llms.txt
          for twin in index.md getting-started.md guides/writing-a-page.md reference/site.md; do
            test -s "$twin" || { echo "no Markdown twin: $twin"; exit 1; }
          done
          test -s llms-full.txt
          echo "llms.txt, llms-full.txt and every twin are there"
