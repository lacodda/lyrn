name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

  # rust-version is a promise to anyone running `cargo install`. Without a job
  # that actually builds on it, the number silently rots the first time a new
  # API is used — so read it from the manifest and hold it to it.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from the manifest
        id: msrv
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Build on the declared MSRV
        run: cargo check --all-targets

  # A template that does not build is not a template. Generate each form on
  # every platform and run the gate the generated project ships with — the one
  # its own CI would run.
  template:
    name: template ${{ matrix.form }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        form: [spa]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        shell: bash
        run: |
          ./target/release/lyrn new demo-app \
            --form ${{ matrix.form }} \
            --accent '#6D7BF2' \
            --yes --no-hooks \
            --path "$RUNNER_TEMP/demo-app"
      - name: Install its dependencies
        working-directory: ${{ runner.temp }}/demo-app
        run: pnpm install --no-frozen-lockfile
      - name: Run the gate it ships with
        working-directory: ${{ runner.temp }}/demo-app
        run: pnpm lint
      - name: Build it
        working-directory: ${{ runner.temp }}/demo-app
        run: pnpm build

  # The cli form is checked with cargo rather than pnpm, and every combination
  # of its add-ons is generated: the failures live in the seams, and a seam
  # only exists once a particular combination is produced.
  template-cli:
    name: template cli (${{ matrix.addons || 'none' }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        addons: ['', 'keyring', 'self-update', 'keyring,self-update']
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps (keyring secret-service)
        if: runner.os == 'Linux' && contains(matrix.addons, 'keyring')
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        shell: bash
        run: |
          args=(new demo-tool --form cli --yes --no-hooks --repo owner/demo-tool --path "$RUNNER_TEMP/demo-tool")
          if [ -n "${{ matrix.addons }}" ]; then
            args+=(--with "${{ matrix.addons }}")
          fi
          ./target/release/lyrn "${args[@]}"
      - name: Run the gate it ships with
        working-directory: ${{ runner.temp }}/demo-tool
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # The desktop form pulls the whole webview stack, so it runs on Linux only
  # and stops short of bundling an installer: what is being checked is that
  # the generated project holds together, not that Tauri can package.
  template-desktop:
    name: template desktop (${{ matrix.addons || 'none' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addons: ['', 'i18n']
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        shell: bash
        run: |
          args=(new demo-app --form desktop --accent '#6D7BF2' --yes --no-hooks --repo owner/demo-app --path "$RUNNER_TEMP/demo-app")
          if [ -n "${{ matrix.addons }}" ]; then
            args+=(--with "${{ matrix.addons }}")
          fi
          ./target/release/lyrn "${args[@]}"
      - name: Install its dependencies
        working-directory: ${{ runner.temp }}/demo-app
        run: pnpm install --no-frozen-lockfile
      - name: Run the frontend gate it ships with
        working-directory: ${{ runner.temp }}/demo-app
        run: pnpm lint
      - name: Build the frontend
        working-directory: ${{ runner.temp }}/demo-app
        run: pnpm build
      - name: Run the Rust gate it ships with
        working-directory: ${{ runner.temp }}/demo-app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # The service form's own tests skip themselves without a database, so the
  # gate has to provide one - otherwise this job would prove only that the
  # project compiles.
  template-service:
    name: template service (${{ matrix.addons || 'none' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addons: ['', 'spa']
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: demo_svc
          POSTGRES_PASSWORD: demo_svc
          POSTGRES_DB: demo_svc
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        shell: bash
        run: |
          args=(new demo-svc --form service --yes --no-hooks --repo owner/demo-svc --path "$RUNNER_TEMP/demo-svc")
          if [ -n "${{ matrix.addons }}" ]; then
            args+=(--with "${{ matrix.addons }}")
          fi
          ./target/release/lyrn "${args[@]}"
      - name: Run the gate it ships with
        working-directory: ${{ runner.temp }}/demo-svc
        env:
          DATABASE_URL: postgres://demo_svc:demo_svc@localhost:5432/demo_svc
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # The workspace form is the cli form in two crates, so the gate is the cli
  # gate with `--workspace` - plus the two things only a workspace can get
  # wrong: doctests in the library, and a library that does not package on its
  # own. `cargo package` on the core crate is what catches a README path or an
  # exclude that leaves the published crate unbuildable.
  template-workspace:
    name: template workspace (${{ matrix.addons || 'none' }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        addons: ['', 'keyring,self-update']
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps (keyring secret-service)
        if: runner.os == 'Linux' && contains(matrix.addons, 'keyring')
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        shell: bash
        run: |
          args=(new demo-tool --form workspace --yes --no-hooks --repo owner/demo-tool --path "$RUNNER_TEMP/demo-tool")
          if [ -n "${{ matrix.addons }}" ]; then
            args+=(--with "${{ matrix.addons }}")
          fi
          ./target/release/lyrn "${args[@]}"
      - name: Run the gate it ships with
        working-directory: ${{ runner.temp }}/demo-tool
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo test --workspace --doc
      # A library that builds in place but not from its own tarball is a crate
      # nobody can install - and it only shows on the day of the release.
      - name: Package the library on its own
        working-directory: ${{ runner.temp }}/demo-tool
        run: cargo package --package demo-tool-core

  # The mono form is checked with pnpm, and the check that matters most is the
  # last one: a package can build, typecheck and pass its tests while being
  # impossible to import, because `tsc` resolves specifiers Node then refuses.
  # Only a different process, outside the workspace, finds that.
  template-mono:
    name: template mono (${{ matrix.addons || 'none' }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        addons: ['', 'stand']
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        shell: bash
        run: |
          args=(new demo-lib --form mono --yes --no-hooks --repo owner/demo-lib --path "$RUNNER_TEMP/demo-lib")
          if [ -n "${{ matrix.addons }}" ]; then
            args+=(--with "${{ matrix.addons }}")
          fi
          ./target/release/lyrn "${args[@]}"
      - name: Install its dependencies
        working-directory: ${{ runner.temp }}/demo-lib
        run: pnpm install --no-frozen-lockfile
      - name: Run the gate it ships with
        working-directory: ${{ runner.temp }}/demo-lib
        run: pnpm lint
      - name: Build it
        working-directory: ${{ runner.temp }}/demo-lib
        run: pnpm build
      - name: Import the package the way a consumer does
        shell: bash
        working-directory: ${{ runner.temp }}/demo-lib
        run: |
          set -eu
          tarball="$(cd packages/demo-lib && pnpm pack --silent | tail -n1)"
          consumer="$RUNNER_TEMP/consumer"
          rm -rf "$consumer" && mkdir -p "$consumer"
          cp "packages/demo-lib/$tarball" "$consumer/"
          cd "$consumer"
          npm init -y > /dev/null
          npm pkg set type=module > /dev/null
          npm install --no-audit --no-fund "./$tarball" > /dev/null
          node --input-type=module -e '
            import { greet } from "demo-lib"
            const actual = greet("world")
            if (actual !== "Hello, world!") {
              throw new Error("the installed package returned " + actual)
            }
            console.log("imported from the tarball:", actual)
          '

  # The plugin form is a Rust binary, so its own gate is the cli form's. What
  # this job adds is the part no unit test can reach: the generated binary run
  # the way the host runs it, and its answers read back with the host's own
  # rules. A plugin that passes `cargo test` and fails here is one the host
  # would list and refuse.
  template-plugin:
    name: template plugin (${{ matrix.host }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        host: [kilna]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        shell: bash
        run: |
          ./target/release/lyrn new demo-count \
            --form plugin \
            --host ${{ matrix.host }} \
            --yes --no-hooks \
            --repo owner/demo-count \
            --path "$RUNNER_TEMP/demo-count"
      - name: Run the gate it ships with
        working-directory: ${{ runner.temp }}/demo-count
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      # The two calls the host makes, against the built binary rather than the
      # test harness: `--manifest` has to parse and declare the host's protocol
      # version, and `run` has to answer a JSON invocation on stdin with JSON
      # on stdout. Checked here with jq so that a plugin whose own tests were
      # weakened is still held to the wire.
      - name: Speak the protocol the way the host does
        shell: bash
        working-directory: ${{ runner.temp }}/demo-count
        run: |
          set -eu
          cargo build --release
          bin="target/release/${{ matrix.host }}-plugin-demo-count"
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"

          manifest="$("$bin" --manifest)"
          echo "$manifest" | jq -e '.protocol_version == 1' > /dev/null
          echo "$manifest" | jq -e '.commands | length > 0' > /dev/null
          key="$(echo "$manifest" | jq -r '.commands[0].key')"

          outcome="$(echo "{\"command\":\"$key\",\"target\":\"work\",\"subject\":{\"title\":\"A subject\"}}" | "$bin" run)"
          echo "$outcome" | jq -e 'has("meta") or has("message")' > /dev/null
          echo "$outcome" | jq -e 'has("error") | not' > /dev/null
          echo "spoke the protocol: $outcome"

  # The tauri-plugin form is two halves that only work if they agree, so both
  # gates run and neither one alone is the answer. The Rust half needs the
  # webview stack to link, which is why this is Linux only - the same reason
  # the desktop form is.
  template-tauri-plugin:
    name: template tauri-plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Linux build deps (webview)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a project
        shell: bash
        run: |
          ./target/release/lyrn new demo-shelf \
            --form tauri-plugin \
            --yes --no-hooks \
            --repo owner/demo-shelf \
            --path "$RUNNER_TEMP/demo-shelf"
      - name: Run the Rust gate it ships with
        working-directory: ${{ runner.temp }}/demo-shelf
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Install its dependencies
        working-directory: ${{ runner.temp }}/demo-shelf
        run: pnpm install --no-frozen-lockfile
      - name: Run the webview gate it ships with
        working-directory: ${{ runner.temp }}/demo-shelf
        run: |
          pnpm lint
          pnpm test
          pnpm build
      # The two halves agree on three spellings, and only one of them is
      # checked by either gate on its own: the permission Tauri generates from
      # `build.rs` has to be the one `permissions/default.toml` grants and the
      # one the webview invokes.
      - name: The halves agree on the command
        shell: bash
        working-directory: ${{ runner.temp }}/demo-shelf
        run: |
          set -eu
          key="$(grep -oP '(?<=COMMANDS: &\[&str\] = &\[")[^"]+' build.rs)"
          # The permission an application grants, and the one Tauri generated
          # from build.rs - two files that have to name the same command.
          grep -qF "allow-$key" permissions/default.toml
          test -f "permissions/autogenerated/commands/$key.toml"
          # The webview's half. `-F` because the invoked string is a template
          # literal, `plugin:${PLUGIN}|<key>`, and `|` is a regular expression
          # alternation that would match almost anything.
          grep -qF "|$key\`" guest-js/index.ts
          grep -qF "const PLUGIN = 'demo-shelf'" guest-js/index.ts
          echo "the halves agree on: $key"

  # The docs form adds to a repository, so it is generated into one: a cli
  # project, which already carries docs/adr/. The run then holds the three
  # promises the form makes - nothing that was there changes, the site builds
  # without a warning, and the build writes the machine-readable twins.
  template-docs:
    name: template docs on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build lyrn
        run: cargo build --release
      - name: Generate a repository, then add docs to it
        shell: bash
        run: |
          set -eu
          lyrn="$PWD/target/release/lyrn"
          "$lyrn" new demo-tool --form cli --yes --no-hooks --repo owner/demo-tool --path "$RUNNER_TEMP/demo-tool"
          cd "$RUNNER_TEMP/demo-tool"
          find . -type f | sort | xargs shasum -a 256 > "$RUNNER_TEMP/before.txt"
          "$lyrn" new demo-tool --form docs --yes --no-hooks --repo owner/demo-tool \
            --description "The demo tool's manual: every command, exactly."
          shasum -a 256 -c "$RUNNER_TEMP/before.txt" > /dev/null
          echo "every file that was there is unchanged"
      - name: Install the site
        working-directory: ${{ runner.temp }}/demo-tool/docs
        run: pnpm install --no-frozen-lockfile
      - name: Build it, without a warning
        shell: bash
        working-directory: ${{ runner.temp }}/demo-tool/docs
        run: |
          set -eu
          pnpm build 2>&1 | tee build.log
          if grep -E '\[WARN\]' build.log; then
            echo "the generated site builds with warnings"
            exit 1
          fi
      - name: Check what the build wrote for agents
        shell: bash
        working-directory: ${{ runner.temp }}/demo-tool/docs/dist
        run: |
          set -eu
          head -1 llms.txt | grep -qx '# Demo Tool'
          grep -q 'https://owner.github.io/demo-tool/guides/writing-a-page.md' llms.txt
          for twin in index.md getting-started.md guides/writing-a-page.md reference/site.md; do
            test -s "$twin" || { echo "no Markdown twin: $twin"; exit 1; }
          done
          test -s llms-full.txt
          echo "llms.txt, llms-full.txt and every twin are there"
