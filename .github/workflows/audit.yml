name: Audit

# What Dependabot would otherwise be for, and the half of it this project
# keeps (docs/adr/0002-dependabot-is-off.md): published advisories against the
# dependencies, and licenses outside the accepted list. On every push and pull
# request, and on Monday mornings for what was published while nothing was
# pushed - a red run with no commit behind it means the world moved, not the
# code.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # RustSec advisories, licenses, banned crates and unknown sources - all four
  # read from deny.toml.
  crates:
    name: Crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The documentation site: every package it builds with, since what the build
  # writes is what ships. Advisories accepted on purpose are listed, with the
  # reason, in docs/pnpm-workspace.yaml.
  site:
    name: Documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Advisories
        run: pnpm audit
