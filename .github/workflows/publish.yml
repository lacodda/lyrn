name: Publish

# Triggered by the tag push directly (not the release event): releases here
# are created by release.yml with GITHUB_TOKEN, and such events do not start
# other workflows.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v2.0.0)
        required: true

permissions: {}

jobs:
  crates-io:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      # A version can only be published once, and a re-run - after a manual
      # bootstrap, or a tag pushed twice - would otherwise fail on the
      # duplicate and leave a red run in the release's history.
      - name: Check whether this version is already on crates.io
        id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if curl -sf "https://crates.io/api/v1/crates/lyrn/$version" -H 'user-agent: lyrn-ci' > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "lyrn $version is already on crates.io; nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Get a crates.io token (OIDC trusted publishing)
        if: steps.check.outputs.published == 'false'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - if: steps.check.outputs.published == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      # npm >= 11.5.1 exchanges the OIDC token itself (trusted publishing);
      # provenance is attached automatically.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check whether this version is already on npm
        id: check
        working-directory: npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "lyrn@$version" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "lyrn $version is already on npm; nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.published == 'false'
        run: npm publish
        working-directory: npm
