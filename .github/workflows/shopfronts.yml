name: Shopfronts

# The README, the manifests, the changelog and the documentation site say one
# version, one description and the commands the program has: `lyrn check`
# holds them to each other. On every push, documentation alone included - the
# shopfronts are mostly documentation.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: lyrn check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The commands are read from the program's own `--help`, so the check
      # builds the program.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # lyrn is held by the lyrn being pushed, not by a release: the version
      # the standard installs elsewhere is not out until this commit's tag.
      - name: Check the shopfronts
        run: cargo run --quiet --locked -- check
