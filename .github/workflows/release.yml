name: Release

on:
  push:
    tags: ['v*']
  # A tag whose run GitHub lost - a job never created, a rerun refused - is
  # built again with `gh workflow run release.yml --ref vX.Y.Z`: the tag stays
  # where it is, and publish waits for this run on the tag's commit.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    # Dispatched on a branch, the run would release the branch's name.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "lyrn-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lyrn.exe", "LICENSE", "README.md" $name
          # The binary carries Cascadia Code to draw the mark with; the OFL
          # asks that its licence travel with every copy.
          Copy-Item "src/mark/font/LICENSE" "$name/LICENSE-CascadiaCode"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="lyrn-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/lyrn" LICENSE README.md "$name"
          cp src/mark/font/LICENSE "$name/LICENSE-CascadiaCode"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: |
            lyrn-*.zip
            lyrn-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
      # The changelog's section for the tag, then .github/release-notes.md:
      # the checklist ticked once the release has been through it.
      - name: Write the release notes
        env:
          CHANGES: ${{ steps.cliff.outputs.content }}
        run: |
          printf '%s\n\n' "$CHANGES" > release-notes.md
          cat .github/release-notes.md >> release-notes.md
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: packages/*
